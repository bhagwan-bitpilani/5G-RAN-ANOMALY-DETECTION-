---
# Enhanced Backend API Deployment for 5G NR KPI Anomaly Detection
# Includes production-ready security, scaling, monitoring, and reliability features
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-api
  namespace: 5g-anomaly-detection
  labels:
    app: app-api
    version: "2.1.0"  # Updated version
    component: backend
    part-of: 5g-anomaly-detection
    environment: production
  annotations:
    description: "FastAPI-based backend for 5G KPI anomaly detection with ML and SLA scaling"
    app.kubernetes.io/version: "2.1.0"
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: 5g-anomaly-detection
spec:
  replicas: 3  # Initial replicas, will be scaled by HPA and SLA scheduler
  revisionHistoryLimit: 5  # Keep more history for rollbacks
  progressDeadlineSeconds: 600  # Allow more time for rollout
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1  # Allow 1 pod down during updates
  selector:
    matchLabels:
      app: app-api
      component: backend
  template:
    metadata:
      labels:
        app: app-api
        version: "2.1.0"
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        prometheus.io/scheme: "http"
        # Application-specific annotations
        app.5g-kpi/version: "2.1.0"
        app.5g-kpi/type: "fastapi"
        app.5g-kpi/commit-hash: "abc123"  # Add during CI/CD
        # Service mesh annotations (if using Istio/Linkerd)
        # linkerd.io/inject: enabled
        # sidecar.istio.io/status: '{"version":"abc123"}'
        # Kubernetes annotations for better management
        kubectl.kubernetes.io/default-container: app-api
        kubectl.kubernetes.io/default-logs-container: app-api
    spec:
      serviceAccountName: app-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Priority class for production workloads
      priorityClassName: system-cluster-critical  # Or custom priority class
      containers:
        - name: app-api
          image: your-registry/5g-anomaly-app:v2.1.0  # Replace with your registry
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 8000  # Same port for metrics
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET_KEY
            - name: JWT_ALGORITHM
              value: "HS256"
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "30"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: "/tmp"
            # Kubernetes-specific env vars
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # SLA Scheduler integration
            - name: SLA_SCHEDULER_ENABLED
              value: "true"
            - name: PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PROMETHEUS_URL
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"  # Increased for ML workloads
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
              httpHeaders:
                - name: X-Health-Check
                  value: liveness
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
              httpHeaders:
                - name: X-Health-Check
                  value: readiness
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: config-volume
              mountPath: /app/config
              readOnly: true
            - name: models-volume
              mountPath: /app/models
              readOnly: true  # For ML models
          lifecycle:
            preStop:
              exec:
                command: 
                  - sh
                  - -c
                  - "sleep 30 && python -c 'import app.main; app.main.graceful_shutdown()'"  # Graceful shutdown
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - "python -c 'import app.main; app.main.post_start_hook()'"  # Post-start hook
      # Init container for database migrations (optional)
      initContainers:
        - name: db-migration
          image: your-registry/5g-anomaly-app:v2.1.0
          command: ["python", "migrate_db.py"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: config-volume
          configMap:
            name: app-config
            items:
              - key: application.yml
                path: application.yml
        - name: models-volume
          configMap:
            name: ml-models  # Separate ConfigMap for ML models
            optional: true
      # Enhanced affinity for better distribution and performance
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - app-api
                topologyKey: kubernetes.io/hostname
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - app-api
              topologyKey: kubernetes.io/zone  # Spread across zones
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - application
                  - key: instance-type
                    operator: In
                    values:
                      - c5.large
                      - m5.large
      # Tolerations for dedicated nodes
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "5g-apps"
          effect: "NoSchedule"
        - key: "workload"
          operator: "Equal"
          value: "5g-backend"
          effect: "NoSchedule"
      # Topology spread constraints for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: app-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: app-api
---
# Enhanced Backend API Service
apiVersion: v1
kind: Service
metadata:
  name: app-api
  namespace: 5g-anomaly-detection
  labels:
    app: app-api
    component: backend
    service: app-api
    version: "2.1.0"
  annotations:
    # Load balancer annotations (cloud-specific)
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:iam::123456789012:server-certificate/your-cert"
    # Azure annotations
    service.beta.kubernetes.io/azure-load-balancer-resource-group: "your-rg"
    # GCP annotations
    cloud.google.com/load-balancer-type: "Internal"
    # Prometheus annotations
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
    # Health check annotations
    alb.ingress.kubernetes.io/healthcheck-path: "/health"
    alb.ingress.kubernetes.io/healthcheck-port: "8000"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthcheck-healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/healthcheck-unhealthy-threshold-count: "2"
    # Service mesh annotations
    # consul.hashicorp.com/service-name: app-api
    # Other annotations
    description: "5G KPI Anomaly Detection Backend API Service"
    app.kubernetes.io/version: "2.1.0"
spec:
  selector:
    app: app-api
    component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
      # NodePort for debugging (remove in production)
      # nodePort: 30080
  type: ClusterIP  # Use LoadBalancer or Ingress for external access
  # For production external access:
  # type: LoadBalancer
  # loadBalancerIP: "your-static-ip"
  # Or use Ingress
  sessionAffinity: None
  # External traffic policy for LoadBalancer
  # externalTrafficPolicy: Local
  # Health check node port
  # healthCheckNodePort: 32000
---
# Enhanced Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-api-pdb
  namespace: 5g-anomaly-detection
  labels:
    app: app-api
    component: ha
spec:
  minAvailable: 2  # Ensure at least 2 pods available during disruptions
  selector:
    matchLabels:
      app: app-api
      component: backend
---
# Enhanced Horizontal Pod Autoscaler with Custom Metrics
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-api-hpa
  namespace: 5g-anomaly-detection
  labels:
    app: app-api
    component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app-api
  minReplicas: 2
  maxReplicas: 20  # Increased for high-demand scenarios
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: 100
    - type: External  # For Prometheus metrics
      external:
        metric:
          name: prometheus_adapter  # Custom metric from Prometheus
          selector:
            matchLabels:
              app: app-api
        target:
          type: AverageValue
          averageValue: "50"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
---
# Enhanced Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-api
  namespace: 5g-anomaly-detection
  labels:
    app: app-api
    component: service-account
  annotations:
    description: "Service account for 5G KPI backend API with necessary permissions"
automountServiceAccountToken: true
---
# Enhanced ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: 5g-anomaly-detection
  labels:
    app: app-api
    component: config
data:
  application.yml: |
    app:
      name: "5G KPI Anomaly Detection"
      version: "2.1.0"
      environment: "production"
    
    logging:
      level: "INFO"
      format: "json"
      handlers:
        - console
        - file
    
    monitoring:
      enabled: true
      port: 8000
      path: "/metrics"
      custom_metrics: true
    
    kpi:
      collection_interval: 15
      anomaly_sensitivity: 0.7
      data_retention_days: 30
      max_batch_size: 1000
    
    security:
      cors_origins:
        - "http://frontend.5g-anomaly-detection.svc.cluster.local"
        - "https://5g-kpi.example.com"
      rate_limit_per_minute: 100
      jwt_expiration: 30
    
    database:
      pool_size: 20
      max_overflow: 30
      pool_timeout: 30
    
    redis:
      max_connections: 20
      decode_responses: true
    
    sla_scheduler:
      enabled: true
      prometheus_url: "http://prometheus:9090"
      kubernetes_namespace: "5g-anomaly-detection"
      scheduler_interval: 60
      max_replicas: 20
      min_replicas: 2
      response_time_ms: 100
      throughput_percent: 95
      availability_percent: 99.9
      error_rate_percent: 1
  # Additional config files
  log_config.json: |
    {
      "version": 1,
      "disable_existing_loggers": false,
      "formatters": {
        "json": {
          "format": "%(asctime)s %(name)s %(levelname)s %(message)s"
        }
      },
      "handlers": {
        "console": {
          "class": "logging.StreamHandler",
          "formatter": "json"
        }
      },
      "root": {
        "level": "INFO",
        "handlers": ["console"]
      }
    }
---
# Enhanced Secrets
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: 5g-anomaly-detection
  labels:
    app: app-api
    component: secrets
type: Opaque
data:
  # Base64 encoded secrets - CHANGE THESE IN PRODUCTION!
  DATABASE_URL: cG9zdGdyZXNxbDovL3Bvc3RncmVzOnBhc3N3b3JkQHBvc3RncmVzcWw6NTQzMi9ucl9rcGk=  # postgresql://postgres:password@postgresql:5432/nr_kpi
  REDIS_URL: cmVkaXM6Ly9yZWRpczo2Mzc5  # redis://redis:6379
  SECRET_KEY: eW91ci1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9u  # your-secret-key-change-in-production
  JWT_SECRET_KEY: eW91ci1qd3Qtc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==  # your-jwt-secret-key-change-in-production
  # Additional secrets
  ENCRYPTION_KEY: eW91ci1lbmNyeXB0aW9uLWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==  # For data encryption
  API_KEY: eW91ci1hcGkta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9u  # For external API calls
---
# Enhanced Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-api-network-policy
  namespace: 5g-anomaly-detection
  labels:
    app: app-api
    component: network
spec:
  podSelector:
    matchLabels:
      app: app-api
      component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - pod
