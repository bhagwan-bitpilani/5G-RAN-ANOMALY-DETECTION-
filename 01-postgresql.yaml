---
# Enhanced PostgreSQL StatefulSet for 5G NR KPI Anomaly Detection
# Includes high availability, monitoring, backups, and security enhancements
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: 5g-anomaly-detection
  labels:
    app: postgresql
    component: database
    version: "14"
    environment: production
  annotations:
    description: "TimescaleDB PostgreSQL cluster for 5G KPI data storage with HA and monitoring"
spec:
  serviceName: postgresql
  replicas: 3  # High availability with 3 replicas
  podManagementPolicy: Parallel  # Faster pod startup
  selector:
    matchLabels:
      app: postgresql
      component: database
  template:
    metadata:
      labels:
        app: postgresql
        component: database
        version: "14"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
        # Additional annotations for monitoring
        k8s-sidecar-target-directory: "/tmp/k8s-sidecar"
    spec:
      serviceAccountName: postgresql
      securityContext:
        runAsUser: 70  # PostgreSQL user ID
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: "OnRootMismatch"
      affinity:
        # Pod anti-affinity for HA
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - postgresql
              topologyKey: kubernetes.io/hostname
      containers:
      - name: postgresql
        image: timescale/timescaledb:2.11.2-pg14  # Pinned version for stability
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_DB
          value: "nr_kpi"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-credentials
              key: postgres-password
        - name: POSTGRES_INITDB_ARGS
          value: "--data-checksums --encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
        - name: POSTGRES_HOST_AUTH_METHOD
          value: "scram-sha-256"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        # TimescaleDB specific settings
        - name: TIMESCALEDB_TELEMETRY
          value: "off"
        - name: POSTGRES_SHARED_PRELOAD_LIBRARIES
          value: "timescaledb,pg_stat_statements,auto_explain,pg_buffercache"
        # Performance tuning for 5G KPI workloads
        - name: POSTGRES_MAX_CONNECTIONS
          value: "300"  # Increased for high-throughput KPI ingestion
        - name: POSTGRES_SHARED_BUFFERS
          value: "2GB"  # Increased for better caching
        - name: POSTGRES_EFFECTIVE_CACHE_SIZE
          value: "6GB"
        - name: POSTGRES_MAINTENANCE_WORK_MEM
          value: "512MB"
        - name: POSTGRES_CHECKPOINT_COMPLETION_TARGET
          value: "0.9"
        - name: POSTGRES_WAL_BUFFERS
          value: "32MB"
        - name: POSTGRES_DEFAULT_STATISTICS_TARGET
          value: "1000"
        - name: POSTGRES_RANDOM_PAGE_COST
          value: "1.1"
        - name: POSTGRES_EFFECTIVE_IO_CONCURRENCY
          value: "300"
        - name: POSTGRES_MAX_WAL_SIZE
          value: "4GB"
        - name: POSTGRES_MIN_WAL_SIZE
          value: "2GB"
        - name: POSTGRES_LOG_STATEMENT
          value: "ddl"
        - name: POSTGRES_LOG_MIN_DURATION_STATEMENT
          value: "2000"  # Log slow queries > 2s
        - name: POSTGRES_WORK_MEM
          value: "64MB"
        ports:
        - name: postgresql
          containerPort: 5432
          protocol: TCP
        - name: metrics
          containerPort: 9187
          protocol: TCP
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/postgresql/data
        - name: postgresql-config
          mountPath: /etc/postgresql/postgresql.conf
          subPath: postgresql.conf
        - name: postgresql-certs
          mountPath: /etc/postgresql/certs
          readOnly: true
        - name: tmp-volume
          mountPath: /tmp
        resources:
          requests:
            memory: "4Gi"  # Increased for TimescaleDB
            cpu: "1"
          limits:
            memory: "8Gi"
            cpu: "4"
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - exec pg_isready -U postgres -h 127.0.0.1 -p 5432
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - exec pg_isready -U postgres -h 127.0.0.1 -p 5432
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - exec pg_isready -U postgres -h 127.0.0.1 -p 5432
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 15
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 70
          runAsGroup: 70
          capabilities:
            drop:
            - ALL
      # Enhanced Prometheus metrics exporter sidecar
      - name: postgres-exporter
        image: prometheuscommunity/postgres-exporter:v0.12.1  # Pinned version
        imagePullPolicy: IfNotPresent
        env:
        - name: DATA_SOURCE_NAME
          valueFrom:
            secretKeyRef:
              name: postgresql-credentials
              key: data-source-name
        - name: PG_EXPORTER_EXTEND_QUERY_PATH
          value: "/etc/postgres-exporter/queries.yaml"
        ports:
        - name: metrics
          containerPort: 9187
          protocol: TCP
        volumeMounts:
        - name: postgres-exporter-config
          mountPath: /etc/postgres-exporter
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          capabilities:
            drop:
            - ALL
      # Enhanced backup sidecar with actual implementation
      - name: backup-sidecar
        image: timescale/timescaledb:2.11.2-pg14
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        args:
        - -c
        - |
          # Enhanced backup script with TimescaleDB support
          while true; do
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            
            # Full database backup with TimescaleDB compression
            pg_dump -h localhost -U postgres -d nr_kpi -F c -b -v -f /backups/full_backup_${TIMESTAMP}.dump
            
            # TimescaleDB-specific backup (hypertables metadata)
            psql -h localhost -U postgres -d nr_kpi -c "SELECT * FROM timescaledb_information.hypertables;" > /backups/hypertables_${TIMESTAMP}.txt
            
            # Compress and cleanup old backups (keep last 7 days)
            find /backups -name "*.dump" -mtime +7 -delete
            find /backups -name "*.txt" -mtime +7 -delete
            
            echo "Backup completed at ${TIMESTAMP}"
            sleep 86400  # Daily backup
          done
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-credentials
              key: postgres-password
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/postgresql/data
          readOnly: true
        - name: backup-storage
          mountPath: /backups
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 70
          runAsGroup: 70
          capabilities:
            drop:
            - ALL
      volumes:
      - name: postgresql-config
        configMap:
          name: postgresql-config
      - name: postgresql-certs
        secret:
          secretName: postgresql-certs
          optional: true
      - name: postgres-exporter-config
        configMap:
          name: postgres-exporter-config
      - name: backup-storage
        persistentVolumeClaim:
          claimName: postgresql-backup-pvc
      - name: tmp-volume
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: postgresql-data
      labels:
        app: postgresql
        component: database
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: fast-ssd  # Use high-performance storage
      resources:
        requests:
          storage: 200Gi  # Increased for production KPI data
---
# Enhanced PostgreSQL Services
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: 5g-anomaly-detection
  labels:
    app: postgresql
    component: database
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  ports:
  - name: postgresql
    port: 5432
    targetPort: 5432
    protocol: TCP
  - name: metrics
    port: 9187
    targetPort: 9187
    protocol: TCP
  selector:
    app: postgresql
    component: database
  clusterIP: None  # Headless service for StatefulSet
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-read
  namespace: 5g-anomaly-detection
  labels:
    app: postgresql
    component: database
    role: read
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  ports:
  - name: postgresql
    port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: postgresql
    component: database
  sessionAffinity: None
---
# Enhanced PVCs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-pvc
  namespace: 5g-anomaly-detection
  labels:
    app: postgresql
    component: database
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 200Gi  # Increased for production
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-backup-pvc
  namespace: 5g-anomaly-detection
  labels:
    app: postgresql
    component: backup
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 100Gi  # Increased for backups
---
# Enhanced ConfigMap with production-ready settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-config
  namespace: 5g-anomaly-detection
  labels:
    app: postgresql
    component: config
data:
  postgresql.conf: |
    # Production PostgreSQL configuration for 5G KPI workloads
    shared_preload_libraries = 'timescaledb,pg_stat_statements,auto_explain,pg_buffercache'
    max_connections = 300
    shared_buffers = 2GB
    effective_cache_size = 6GB
    maintenance_work_mem = 512MB
    checkpoint_completion_target = 0.9
    wal_buffers = 32MB
    default_statistics_target = 1000
    random_page_cost = 1.1
    effective_io_concurrency = 300
    work_mem = 64MB
    max_wal_size = 4GB
    min_wal_size = 2GB
    log_statement = 'ddl'
    log_min_duration_statement = 2000
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_timezone = 'UTC'
    
    # TimescaleDB specific settings
    timescaledb.telemetry_level = 'off'
    timescaledb.max_background_workers = 8
    timescaledb.license = 'timescale'  # If using enterprise features
    
    # Auto-explain for query analysis
    auto_explain.log_min_duration = 2000
    auto_explain.log_analyze = true
    auto_explain.log_buffers = true
    auto_explain.log_timing = true
    auto_explain.log_verbose = true
    auto_explain.log_format = 'json'
    
    # SSL configuration
    ssl = on
    ssl_cert_file = '/etc/postgresql/certs/tls.crt'
    ssl_key_file = '/etc/postgresql/certs/tls.key'
    ssl_ca_file = '/etc/postgresql/certs/ca.crt'
    ssl_min_protocol_version = 'TLSv1.2'
    
    # Connection settings
    listen_addresses = '*'
    tcp_keepalives_idle = 60
    tcp_keepalives_interval = 10
    tcp_keepalives_count = 6
---
# Additional ConfigMap for PostgreSQL Exporter
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-config
  namespace: 5g-anomaly-detection
  labels:
    app: postgresql
    component: monitoring
data:
  queries.yaml: |
    pg_postmaster:
      query: "SELECT pg_postmaster_start_time as start_time_seconds from pg_postmaster_start_time() as start_time_seconds"
      metrics:
        - start_time_seconds:
            usage: "GAUGE"
            description: "Time at which postmaster started"
    pg_settings:
      query: "SELECT name, setting FROM pg_settings WHERE vartype = 'integer' ORDER BY 1"
      metrics:
        - name:
            usage: "LABEL"
            description: "Name of the setting"
        - setting:
            usage: "GAUGE"
            description: "Setting value"
    pg_timescaledb_hypertables:
      query: "SELECT hypertable_name, num_chunks, compression_enabled FROM timescaledb_information.hypertables"
      metrics:
        - hypertable_name:
            usage: "LABEL"
            description: "Name of the hypertable"
        - num_chunks:
            usage: "GAUGE"
            description: "Number of chunks in the hypertable"
        - compression_enabled:
            usage: "GAUGE"
            description: "Whether compression is enabled (1) or not (0)"
---
# Enhanced Secrets
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: 5g-anomaly-detection
  labels:
    app: postgresql
    component: credentials
type: Opaque
data:
  postgres-password: cGFzc3dvcmQ=  # CHANGE THIS IN PRODUCTION!
  data-source-name: cG9zdGdyZXNxbDovL3Bvc3RncmVzOnBhc3N3b3JkQHBvc3RncmVzcWw6NTQzMi9ucl9rcGk=  # Base64 encoded
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-certs
  namespace: 5g-anomaly-detection
  labels:
    app: postgresql
    component: certificates
type: Opaque
data:
  # In production, replace with actual base64-encoded certificates
  tls.crt: ""  # Your server certificate
  tls.key: ""  # Your private key
  ca.crt: ""   # Certificate Authority certificate
---
# Enhanced Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgresql-pdb
  namespace: 5g-anomaly-detection
  labels:
    app: postgresql
    component: ha
spec:
  minAvailable: 2  # Ensure at least 2 pods are available during disruptions
  selector:
    matchLabels:
      app: postgresql
      component: database
---
# Enhanced CronJob for Backups with retention and notifications
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgresql-backup
  namespace: 5g-anomaly-detection
  labels:
    app: postgresql
    component: backup
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: postgresql
          containers:
          - name: backup
            image: timescale/timescaledb:2.11.2-pg14
            command:
            - /bin/sh
            - -c
            - |
              set -e
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              
              # Create backup directory if it doesn't exist
              mkdir -p /backups/${TIMESTAMP}
              
              # Full database backup
              pg_dump -h postgresql-0.postgresql.5g-anomaly-detection.svc.cluster.local \
                      -U postgres -d nr_kpi -F c -b -
